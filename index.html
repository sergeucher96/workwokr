<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EarnStore</title>
    <link rel="stylesheet" href="style.css?v=6">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="loader"></div>

        <header class="app-header" id="main-header">
            <div class="topbar">
                <div class="brand-lockup">
                    <div class="brand-mark" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div>
                        <div class="app-eyebrow">Мини-каталог</div>
                        <h1>EarnStore</h1>
                    </div>
                </div>
                <div class="topbar-badge">Лучшее</div>
            </div>
            
            <!-- Урезанный блок цитаты -->
            <div class="header-content compact-quote">
                <div class="quote-row">
                    <div class="quote-label-mini">Мысль дня:</div>
                    <div id="motivation-text"></div>
                </div>
                <div id="motivation-author"></div>
            </div>
        </header>

        <main id="main-content"></main>
    </div>
    <script src="script.js?v=6"></script>
</body>
</html>
